# =============================================================================
# Tmux Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------

# Use 256 colors and true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*256col*:RGB"
set -ag terminal-overrides ",ghostty:RGB"

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Faster command sequences (no delay for escape)
set -sg escape-time 0

# Increase repeat timeout
set -g repeat-time 500

# Focus events for vim/neovim
set -g focus-events on

# Refresh status bar more often
set -g status-interval 5

# Use vi keys in copy mode
setw -g mode-keys vi

# -----------------------------------------------------------------------------
# Prefix Key
# -----------------------------------------------------------------------------

# Change prefix from Ctrl+b to Ctrl+a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -----------------------------------------------------------------------------
# Key Bindings - General
# -----------------------------------------------------------------------------

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Clear screen and scrollback
bind C-l send-keys C-l \; clear-history

# -----------------------------------------------------------------------------
# Key Bindings - Windows
# -----------------------------------------------------------------------------

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# Window navigation
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Previous/next window
bind -n M-[ previous-window
bind -n M-] next-window

# Swap windows
bind -n M-{ swap-window -t -1 \; previous-window
bind -n M-} swap-window -t +1 \; next-window

# -----------------------------------------------------------------------------
# Key Bindings - Panes
# -----------------------------------------------------------------------------

# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"  # Easier than shift+|
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + vim keys for pane navigation (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resizing with prefix + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle zoom
bind z resize-pane -Z

# Close pane
bind x kill-pane

# -----------------------------------------------------------------------------
# Key Bindings - Copy Mode
# -----------------------------------------------------------------------------

# Enter copy mode with prefix + [
bind [ copy-mode

# Vi-style copy mode bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy to system clipboard (macOS)
if-shell "uname | grep -q Darwin" {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
}

# Copy to system clipboard (Linux with xclip)
if-shell "uname | grep -q Linux" {
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
}

# -----------------------------------------------------------------------------
# Key Bindings - Sessions
# -----------------------------------------------------------------------------

# Session management
bind S choose-session
bind N new-session
bind X kill-session

# Switch to last session
bind L switch-client -l

# -----------------------------------------------------------------------------
# Catppuccin Frappe Theme
# -----------------------------------------------------------------------------

# Color definitions
thm_bg="#303446"
thm_fg="#c6d0f5"
thm_cyan="#99d1db"
thm_black="#292c3c"
thm_gray="#414559"
thm_magenta="#ca9ee6"
thm_pink="#f4b8e4"
thm_red="#e78284"
thm_green="#a6d189"
thm_yellow="#e5c890"
thm_blue="#8caaee"
thm_orange="#ef9f76"
thm_lavender="#babbf1"

# Status bar
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style "bg=${thm_bg},fg=${thm_fg}"

# Status bar length
set -g status-left-length 100
set -g status-right-length 100

# Left status: session name
set -g status-left "#[bg=${thm_lavender},fg=${thm_black},bold] #S #[bg=${thm_bg},fg=${thm_lavender}]"

# Right status: date and time
set -g status-right "#[fg=${thm_gray}]#[bg=${thm_gray},fg=${thm_fg}] %a %b %d #[fg=${thm_blue}]#[bg=${thm_blue},fg=${thm_black}] %H:%M "

# Window status
set -g window-status-format "#[fg=${thm_gray}]#[bg=${thm_gray},fg=${thm_fg}] #I #W #[fg=${thm_gray},bg=${thm_bg}]"
set -g window-status-current-format "#[fg=${thm_blue}]#[bg=${thm_blue},fg=${thm_black}] #I #W #[fg=${thm_blue},bg=${thm_bg}]"
set -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_lavender}"

# Message styling
set -g message-style "bg=${thm_gray},fg=${thm_fg}"
set -g message-command-style "bg=${thm_gray},fg=${thm_fg}"

# Mode styling (copy mode, etc.)
set -g mode-style "bg=${thm_lavender},fg=${thm_black}"

# Clock mode
set -g clock-mode-colour "${thm_blue}"
set -g clock-mode-style 24

