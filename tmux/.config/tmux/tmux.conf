# =============================================================================
# tmux configuration
# =============================================================================

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

# Remap prefix from Ctrl+b to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# True color support (required for Catppuccin and Neovim themes)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reduce escape time (prevents Neovim lag on Esc)
set -sg escape-time 10

# Increase scrollback buffer
set -g history-limit 10000

# Start windows and panes at 1, not 0 (easier keyboard reach)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable mouse (click to focus, scroll history)
set -g mouse on

# Enable focus events (lets Neovim know when it gains/loses focus)
set -g focus-events on

# Sync clipboard with macOS
set -g set-clipboard on

# renumber-windows
set -g renumber-windows on

# -----------------------------------------------------------------------------
# Key bindings
# -----------------------------------------------------------------------------

# Reload config in-place
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Split panes with | and - (keeping current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeping current working directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable with -r flag)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -----------------------------------------------------------------------------
# Copy mode (vi-style)
# -----------------------------------------------------------------------------

setw -g mode-keys vi

# v to begin selection, y to yank to system clipboard (via tmux-yank)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# -----------------------------------------------------------------------------
# Status bar
# -----------------------------------------------------------------------------

set -g status-position top
set -g status-interval 5

# -----------------------------------------------------------------------------
# Plugins (via TPM - Tmux Plugin Manager)
# Install: prefix + I    Reload: prefix + r    Update: prefix + U
# -----------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'          # Sensible defaults
set -g @plugin 'tmux-plugins/tmux-yank'              # Sync copy buffer to macOS clipboard
set -g @plugin 'catppuccin/tmux'                     # Catppuccin theme
set -g @plugin 'sainnhe/tmux-fzf'                    # FZF Session manager
set -g @plugin 'wfxr/tmux-fzf-url'                   # FZF url open

# -----------------------------------------------------------------------------
# Catppuccin theme configuration
# -----------------------------------------------------------------------------

set -g status-left ''
set -g status-right ''

set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"

# Status bar modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -g @catppuccin_status_modules_right "session date_time"
set -g @catppuccin_status_modules_left ""
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory" # date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
# Date/time format
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"

# -----------------------------------------------------------------------------
# Other plugin configuration
# -----------------------------------------------------------------------------

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

bind-key W display-popup -E -w 80% -h 80% "worktui popup"


# -----------------------------------------------------------------------------
# Initialize TPM
# -----------------------------------------------------------------------------

run '~/.tmux/plugins/tpm/tpm'
