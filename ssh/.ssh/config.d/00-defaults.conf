# =============================================================================
# Default SSH host configurations
# =============================================================================

# -----------------------------------------------------------------------------
# GitHub
# -----------------------------------------------------------------------------

Host github.com gh
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519
    # Uncomment for 1Password SSH agent:
    # IdentityFile ~/.ssh/id_ed25519.pub
    # IdentityAgent "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"

# -----------------------------------------------------------------------------
# GitLab
# -----------------------------------------------------------------------------

Host gitlab.com gl
    HostName gitlab.com
    User git
    IdentityFile ~/.ssh/id_ed25519

# -----------------------------------------------------------------------------
# Bitbucket
# -----------------------------------------------------------------------------

Host bitbucket.org bb
    HostName bitbucket.org
    User git
    IdentityFile ~/.ssh/id_ed25519

# -----------------------------------------------------------------------------
# Codeberg
# -----------------------------------------------------------------------------

Host codeberg.org
    HostName codeberg.org
    User git
    IdentityFile ~/.ssh/id_ed25519
